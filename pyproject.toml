[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelreader"
version = "0.0.1"
description = "Chat with recorded lectures and videos: local-first multimodal RAG with seekable citations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Borck", email = "michael.borck@curtin.edu.au" },
]
keywords = [
    "rag",
    "video",
    "lecture",
    "transcript",
    "multimodal",
    "embeddings",
    "education",
    "cli",
    "local-first",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Education",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# Text embeddings with no API key. Multimodal tiers need torch-backed models.
local = ["fastembed>=0.4.0"]
# Speech to text with word-level timestamps.
asr = ["faster-whisper>=1.2.0", "av>=11,<19"]
# Scene and slide detection for keyframes and chapter boundaries.
scene = ["scenedetect>=0.6.4", "pillow>=10.0.0"]
# Local HTTP API used by the desktop shell.
serve = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
# Vector store for libraries that outgrow the in-memory numpy index.
index = ["sqlite-vec>=0.1.6"]
# OS keychain for API keys instead of environment variables.
keyring = ["keyring>=25.0.0"]
all = [
    "fastembed>=0.4.0",
    "faster-whisper>=1.2.0",
    "av>=11,<19",
    "scenedetect>=0.6.4",
    "pillow>=10.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlite-vec>=0.1.6",
    "keyring>=25.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "basedpyright>=1.28.0",
]

[project.scripts]
reelreader = "reelreader.cli:app"

[project.urls]
Homepage = "https://github.com/michael-borck/reelreader"
Documentation = "https://github.com/michael-borck/reelreader/tree/main/docs"
Issues = "https://github.com/michael-borck/reelreader/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reelreader"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["**/._*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
reportUnusedParameter = false
reportCallInDefaultInitializer = false
